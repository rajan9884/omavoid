# MPV Configuration
hwdec=auto-safe
vo=gpu
gpu-context=wayland
ao=pipewire,pulse

# Audio quality and normalization for stereo downmix
audio-channels=stereo
audio-normalize-downmix=yes
volume-max=150

# Default window sizing
autofit-larger=875x600

# Keep window open when media finishes, show window for audio
force-window=immediate
keep-open=yes
save-position-on-quit=yes
