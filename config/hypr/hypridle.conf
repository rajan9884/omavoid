# Hypridle configuration for Void Linux
# Handles screen dimming, locking, DPMS off, and sleep

general {
    lock_cmd = void-system-lock
    before_sleep_cmd = void-system-lock
    after_sleep_cmd = void-system-wake
    ignore_dbus_inhibit = false
}

# Dim screen backlight after 2.5 minutes of inactivity (skipped if stay-awake is enabled)
listener {
    timeout = 150
    condition_cmd = test ! -f "$HOME/.local/state/void/indicators/stay-awake"
    condition_retry = 10
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock screen after 5 minutes of inactivity (skipped if stay-awake is enabled)
listener {
    timeout = 300
    condition_cmd = test ! -f "$HOME/.local/state/void/indicators/stay-awake"
    condition_retry = 10
    on-timeout = void-system-lock
}

# Turn off display after 5.5 minutes of inactivity (skipped if stay-awake is enabled)
listener {
    timeout = 330
    condition_cmd = test ! -f "$HOME/.local/state/void/indicators/stay-awake"
    condition_retry = 10
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = void-system-wake
}

# Suspend system after 30 minutes of inactivity (skipped if stay-awake is enabled)
listener {
    timeout = 1800
    condition_cmd = test ! -f "$HOME/.local/state/void/indicators/stay-awake"
    condition_retry = 30
    on-timeout = void-system suspend
}
