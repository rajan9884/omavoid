# Hypridle configuration for Void Linux
# Handles screen dimming, locking, DPMS off, and sleep

general {
    lock_cmd = void-system-lock
    before_sleep_cmd = void-system-lock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
}

# Dim screen backlight after 2.5 minutes of inactivity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = void-system-lock
}

# Turn off display after 5.5 minutes of inactivity
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend system after 30 minutes of inactivity
listener {
    timeout = 1800
    on-timeout = void-system suspend
}
