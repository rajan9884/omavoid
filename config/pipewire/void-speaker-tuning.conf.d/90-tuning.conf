# DTS Audio Processing equivalent speaker tuning for Acer Swift SFG14-71 (1025:1699).
# Extracted directly from Windows OEM DTS APO4 configuration and GPEQ tuning blobs.
#
# Provides:
# 1. Highpass protection (130Hz, 12dB/oct) to prevent driver cone excursion overload and crackle.
# 2. Laboratory-measured OEM chassis resonance notch filters (260Hz, 530Hz, 680Hz, 780Hz, 900Hz, 1150Hz, 3000Hz, 4600Hz, 6500Hz).
# 3. Virtual Bass psychoacoustic punch (280Hz +4.0dB) matching DTS TBHDX.
# 4. Vocal and dialogue clarity lift (2200Hz +3.5dB) matching DTS Dialogue Enhancement.
# 5. High-shelf brilliance (10kHz +3.0dB).
# 6. LSP lookahead brickwall limiter with loudness boost (g_in=4.0, boost=1, th=0.95)
#    matching DTS MBHL loudness boost (loud & clear at 30-35% like Windows with zero distortion).

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers (DTS Tuned)"
      media.name       = "Laptop Speakers (DTS Tuned)"

      filter.graph = {
        nodes = [
          # Left Channel Filters
          { type = builtin name = hp_l     label = bq_highpass  control = { "Freq" = 130.0  "Q" = 0.707 } }
          { type = builtin name = bass_l   label = bq_peaking   control = { "Freq" = 280.0  "Q" = 1.4 "Gain" = 4.0 } }
          { type = builtin name = eq1_l    label = bq_peaking   control = { "Freq" = 260.0  "Q" = 3.6 "Gain" = -3.0 } }
          { type = builtin name = eq2_l    label = bq_peaking   control = { "Freq" = 530.0  "Q" = 4.0 "Gain" = -3.0 } }
          { type = builtin name = eq3_l    label = bq_peaking   control = { "Freq" = 680.0  "Q" = 3.6 "Gain" = -4.0 } }
          { type = builtin name = eq4_l    label = bq_peaking   control = { "Freq" = 780.0  "Q" = 5.0 "Gain" = -2.5 } }
          { type = builtin name = eq5_l    label = bq_peaking   control = { "Freq" = 900.0  "Q" = 3.0 "Gain" = -6.0 } }
          { type = builtin name = eq6_l    label = bq_peaking   control = { "Freq" = 1150.0 "Q" = 3.5 "Gain" = -3.5 } }
          { type = builtin name = vocal_l  label = bq_peaking   control = { "Freq" = 2200.0 "Q" = 1.6 "Gain" = 3.5 } }
          { type = builtin name = eq7_l    label = bq_peaking   control = { "Freq" = 3000.0 "Q" = 3.1 "Gain" = -3.5 } }
          { type = builtin name = eq8_l    label = bq_peaking   control = { "Freq" = 4600.0 "Q" = 3.2 "Gain" = -4.0 } }
          { type = builtin name = eq9_l    label = bq_peaking   control = { "Freq" = 6500.0 "Q" = 4.0 "Gain" = -2.0 } }
          { type = builtin name = air_l    label = bq_highshelf control = { "Freq" = 10000.0 "Q" = 0.707 "Gain" = 3.0 } }

          # Right Channel Filters
          { type = builtin name = hp_r     label = bq_highpass  control = { "Freq" = 130.0  "Q" = 0.707 } }
          { type = builtin name = bass_r   label = bq_peaking   control = { "Freq" = 280.0  "Q" = 1.4 "Gain" = 4.0 } }
          { type = builtin name = eq1_r    label = bq_peaking   control = { "Freq" = 260.0  "Q" = 3.6 "Gain" = -3.0 } }
          { type = builtin name = eq2_r    label = bq_peaking   control = { "Freq" = 530.0  "Q" = 4.0 "Gain" = -3.0 } }
          { type = builtin name = eq3_r    label = bq_peaking   control = { "Freq" = 680.0  "Q" = 3.6 "Gain" = -4.0 } }
          { type = builtin name = eq4_r    label = bq_peaking   control = { "Freq" = 780.0  "Q" = 5.0 "Gain" = -2.5 } }
          { type = builtin name = eq5_r    label = bq_peaking   control = { "Freq" = 900.0  "Q" = 3.0 "Gain" = -6.0 } }
          { type = builtin name = eq6_r    label = bq_peaking   control = { "Freq" = 1150.0 "Q" = 3.5 "Gain" = -3.5 } }
          { type = builtin name = vocal_r  label = bq_peaking   control = { "Freq" = 2200.0 "Q" = 1.6 "Gain" = 3.5 } }
          { type = builtin name = eq7_r    label = bq_peaking   control = { "Freq" = 3000.0 "Q" = 3.1 "Gain" = -3.5 } }
          { type = builtin name = eq8_r    label = bq_peaking   control = { "Freq" = 4600.0 "Q" = 3.2 "Gain" = -4.0 } }
          { type = builtin name = eq9_r    label = bq_peaking   control = { "Freq" = 6500.0 "Q" = 4.0 "Gain" = -2.0 } }
          { type = builtin name = air_r    label = bq_highshelf control = { "Freq" = 10000.0 "Q" = 0.707 "Gain" = 3.0 } }

          # DTS MBHL Lookahead Brickwall Limiter + Loudness Boost
          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              "alr"   = 1
              "boost" = 1
              "g_in"  = 3.8
              "th"    = 0.95
              "lk"    = 5.0
            }
          }
        ]

        links = [
          { output = "hp_l:Out"    input = "bass_l:In" }
          { output = "bass_l:Out"  input = "eq1_l:In" }
          { output = "eq1_l:Out"   input = "eq2_l:In" }
          { output = "eq2_l:Out"   input = "eq3_l:In" }
          { output = "eq3_l:Out"   input = "eq4_l:In" }
          { output = "eq4_l:Out"   input = "eq5_l:In" }
          { output = "eq5_l:Out"   input = "eq6_l:In" }
          { output = "eq6_l:Out"   input = "vocal_l:In" }
          { output = "vocal_l:Out" input = "eq7_l:In" }
          { output = "eq7_l:Out"   input = "eq8_l:In" }
          { output = "eq8_l:Out"   input = "eq9_l:In" }
          { output = "eq9_l:Out"   input = "air_l:In" }
          { output = "air_l:Out"   input = "limiter:in_l" }

          { output = "hp_r:Out"    input = "bass_r:In" }
          { output = "bass_r:Out"  input = "eq1_r:In" }
          { output = "eq1_r:Out"   input = "eq2_r:In" }
          { output = "eq2_r:Out"   input = "eq3_r:In" }
          { output = "eq3_r:Out"   input = "eq4_r:In" }
          { output = "eq4_r:Out"   input = "eq5_r:In" }
          { output = "eq5_r:Out"   input = "eq6_r:In" }
          { output = "eq6_r:Out"   input = "vocal_r:In" }
          { output = "vocal_r:Out" input = "eq7_r:In" }
          { output = "eq7_r:Out"   input = "eq8_r:In" }
          { output = "eq8_r:Out"   input = "eq9_r:In" }
          { output = "eq9_r:Out"   input = "air_r:In" }
          { output = "air_r:Out"   input = "limiter:in_r" }
        ]

        inputs  = [ "hp_l:In" "hp_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name        = "void_speaker_tuning"
        media.class      = Audio/Sink
        priority.session = 1500
        priority.driver  = 1500
      }
      playback.props = {
        node.name     = "void_speaker_tuning_output"
        node.passive  = true
        target.object = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
